specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Token
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: Token
      startBlock: 6000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
        - Account
        - AccountBalance
        - TokenTransfer
      abis:
        - name: Token
          file: ../contracts/artifacts/contracts/src/token/Token.sol/Token.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: TokensLocked(indexed address,uint256)
          handler: handleTokensLocked
        - event: TokensUnlocked(indexed address,uint256)
          handler: handleTokensUnlocked
        - event: AddressFrozen(indexed address,indexed bool,indexed address)
          handler: handleAddressFrozen
        - event: Paused(address)
          handler: handlePaused
        - event: Unpaused(address)
          handler: handleUnpaused
      file: ./src/mapping.ts

  - kind: ethereum
    name: IdentityRegistry
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: IdentityRegistry
      startBlock: 6000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Account
      abis:
        - name: IdentityRegistry
          file: ../contracts/artifacts/contracts/src/registry/IdentityRegistry.sol/IdentityRegistry.json
      eventHandlers:
        - event: IdentityRegistered(indexed address,indexed address)
          handler: handleIdentityRegistered
        - event: IdentityRemoved(indexed address,indexed address)
          handler: handleIdentityRemoved
        - event: CountryUpdated(indexed address,indexed uint16)
          handler: handleCountryUpdated
      file: ./src/mapping.ts

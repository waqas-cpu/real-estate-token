name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  security-secrets:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend TypeScript
        run: npm run typecheck

      - name: Build frontend bundle
        run: npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 7

  backend:
    name: Backend Tests & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck backend TypeScript
        working-directory: backend
        run: npm run typecheck

      - name: Run Vitest backend test suite (Unit, Cryptography & CRUD)
        working-directory: backend
        run: npm run test

  contracts:
    name: Smart Contracts Compile, Test & Slither
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Setup Python for Slither
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither Analyzer
        run: pip install slither-analyzer

      - name: Install smart contract dependencies
        working-directory: contracts
        run: npm ci

      - name: Compile Hardhat smart contracts
        working-directory: contracts
        run: npm run compile

      - name: Run Hardhat test suite (ERC-3643 RWA & Security features)
        working-directory: contracts
        run: npm run test

      - name: Run Slither Static Analysis
        working-directory: contracts
        continue-on-error: true
        run: slither . --exclude-dependencies --checklist || true

  migrations-validate:
    name: Database Migrations & Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rwa_ci_test
          POSTGRES_USER: rwa_user
          POSTGRES_PASSWORD: rwa_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply All SQL Migrations (001 to 009)
        env:
          DATABASE_URL: postgresql://rwa_user:rwa_ci_password@localhost:5432/rwa_ci_test
        run: |
          chmod +x scripts/migrate.sh
          ./scripts/migrate.sh

      - name: Verify Idempotent Migration Re-execution
        env:
          DATABASE_URL: postgresql://rwa_user:rwa_ci_password@localhost:5432/rwa_ci_test
        run: |
          echo "Testing second execution to assert idempotency..."
          ./scripts/migrate.sh

      - name: Validate Core Database Schema & Tables
        env:
          PGPASSWORD: rwa_ci_password
        run: |
          echo "Asserting core tables exist in PostgreSQL..."
          REQUIRED_TABLES=("physical_assets" "digital_twins" "oracle_attestations" "security_tokens" "token_offerings" "spvs" "rwa_properties" "rwa_tokens" "rwa_token_allocations" "rwa_investors" "rwa_kyc_verifications" "rwa_wallets" "rwa_transactions" "rwa_audit_logs")
          for tbl in "${REQUIRED_TABLES[@]}"; do
            EXISTS=$(psql -h localhost -U rwa_user -d rwa_ci_test -t -A -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_name='$tbl';")
            if [ "$EXISTS" -eq 1 ]; then
              echo "✅ Table $tbl exists."
            else
              echo "❌ ERROR: Table $tbl was not created!"
              exit 1
            fi
          done
          echo "All schema verification assertions passed!"

  platform-orchestration-e2e:
    name: Platform Multi-Container Orchestration & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build All Production Microservice Images
        run: |
          echo "Building Frontend Image..."
          docker build -t rwa-frontend:ci-test -f Dockerfile.frontend .

          echo "Building Backend API Image..."
          docker build -t rwa-backend:ci-test -f Dockerfile.backend .

          echo "Building Indexer Daemon Image..."
          docker build -t rwa-indexer:ci-test -f Dockerfile.indexer .

          echo "Building Oracle Ingestion Daemon Image..."
          docker build -t rwa-oracle:ci-test -f Dockerfile.oracle .

          echo "Building Worker Daemon Image..."
          docker build -t rwa-worker:ci-test -f Dockerfile.worker .

          echo "Building Smart Contracts Image..."
          docker build -t rwa-contracts:ci-test -f contracts/Dockerfile .

      - name: Run Trivy Vulnerability Scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'rwa-backend:ci-test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'rwa-frontend:ci-test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Execute Multi-Container Integration Test Suite
        run: |
          echo "Running automated integration test compose..."
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from backend-test

      - name: Verify Isolated Backend Container & Healthcheck
        run: |
          echo "Starting test container..."
          docker run -d --name rwa-ci-backend \
            -p 3001:3001 \
            -e NODE_ENV=production \
            -e PORT=3001 \
            rwa-backend:ci-test

          echo "Awaiting healthy status from /health/live endpoint..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health/live || true)
            if [ "$STATUS" = "200" ]; then
              echo "Healthcheck passed with HTTP 200!"
              break
            fi
            echo "Waiting for container readiness... (attempt $i/30, status=$STATUS)"
            sleep 2
          done

          if [ "$STATUS" != "200" ]; then
            echo "Healthcheck failed! Container logs:"
            docker logs rwa-ci-backend
            exit 1
          fi

          echo "Verifying non-root user execution..."
          USER_RUNNING=$(docker exec rwa-ci-backend whoami)
          echo "Container is running as user: $USER_RUNNING"
          if [ "$USER_RUNNING" != "rwa" ]; then
            echo "Security warning: container is not running as 'rwa' non-root user!"
            exit 1
          fi

          docker stop rwa-ci-backend
          docker rm rwa-ci-backend

  ci-gate:
    name: CI Gate
    needs: [lint, security-secrets, frontend, backend, contracts, migrations-validate, platform-orchestration-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI Gate
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ CI Gate Failed: One or more prerequisite jobs failed or were cancelled."
            exit 1
          fi
          echo "✅ CI Gate Passed: All code quality, security scans, unit tests, migrations, and container orchestration tests succeeded!"

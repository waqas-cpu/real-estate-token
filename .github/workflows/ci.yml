name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  security-secrets:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend TypeScript
        run: npm run typecheck

      - name: Build frontend bundle
        run: npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 7

  backend:
    name: Backend Tests & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck backend TypeScript
        working-directory: backend
        run: npm run typecheck

      - name: Run Vitest backend test suite
        working-directory: backend
        run: npm run test

  contracts:
    name: Smart Contracts Compile, Test & Slither
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Setup Python for Slither
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither Analyzer
        run: pip install slither-analyzer

      - name: Install smart contract dependencies
        working-directory: contracts
        run: npm ci

      - name: Compile Hardhat smart contracts
        working-directory: contracts
        run: npm run compile

      - name: Run Hardhat test suite (ERC-3643 RWA & Security features)
        working-directory: contracts
        run: npm run test

      - name: Run Slither Static Analysis
        working-directory: contracts
        continue-on-error: true
        run: slither . --exclude-dependencies --checklist || true

  docker-build-and-scan:
    name: Docker Builds & Vulnerability Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Frontend Image
      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          load: true
          tags: rwa-frontend:ci-test

      # Build Backend Image
      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          load: true
          tags: rwa-backend:ci-test

      # Build Contracts Image
      - name: Build Contracts Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contracts/Dockerfile
          load: true
          tags: rwa-contracts:ci-test

      # Scan Backend Image with Trivy
      - name: Run Trivy vulnerability scanner on backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'rwa-backend:ci-test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Test backend container startup and healthcheck
      - name: Test backend container startup and healthcheck
        run: |
          echo "Starting test container..."
          docker run -d --name rwa-ci-backend \
            -p 3001:3001 \
            -e NODE_ENV=production \
            -e PORT=3001 \
            rwa-backend:ci-test

          echo "Awaiting healthy status from /health/live endpoint..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health/live || true)
            if [ "$STATUS" = "200" ]; then
              echo "Healthcheck passed with HTTP 200!"
              break
            fi
            echo "Waiting for container readiness... (attempt $i/30, status=$STATUS)"
            sleep 2
          done

          if [ "$STATUS" != "200" ]; then
            echo "Healthcheck failed! Container logs:"
            docker logs rwa-ci-backend
            exit 1
          fi

          echo "Verifying non-root user execution..."
          USER_RUNNING=$(docker exec rwa-ci-backend whoami)
          echo "Container is running as user: $USER_RUNNING"
          if [ "$USER_RUNNING" != "rwa" ]; then
            echo "Security warning: container is not running as 'rwa' non-root user!"
            exit 1
          fi

          docker stop rwa-ci-backend
          docker rm rwa-ci-backend

  ci-gate:
    name: CI Gate
    needs: [lint, security-secrets, frontend, backend, contracts, docker-build-and-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI Gate
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ CI Gate Failed: One or more prerequisite jobs failed or were cancelled."
            exit 1
          fi
          echo "✅ CI Gate Passed: All code quality, security scans, unit tests, and container builds succeeded!"

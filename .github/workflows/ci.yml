name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend TypeScript
        run: npm run typecheck

      - name: Build frontend bundle
        run: npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 7

  backend:
    name: Backend Tests & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck backend TypeScript
        working-directory: backend
        run: npm run typecheck

      - name: Run Vitest backend test suite
        working-directory: backend
        run: npm run test

  contracts:
    name: Smart Contracts Compile & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install smart contract dependencies
        working-directory: contracts
        run: npm ci

      - name: Compile Hardhat smart contracts
        working-directory: contracts
        run: npm run compile

      - name: Run Hardhat test suite (ERC-3643 RWA)
        working-directory: contracts
        run: npm run test

  docker-smoke:
    name: Docker Build & Healthcheck Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: rwa-platform:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container startup and healthcheck
        run: |
          echo "Starting test container..."
          docker run -d --name rwa-ci-container \
            -p 3001:3001 \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e SERVE_FRONTEND=true \
            rwa-platform:ci-test

          echo "Awaiting healthy status from /health/live endpoint..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health/live || true)
            if [ "$STATUS" = "200" ]; then
              echo "Healthcheck passed with HTTP 200!"
              break
            fi
            echo "Waiting for container readiness... (attempt $i/30, status=$STATUS)"
            sleep 2
          done

          if [ "$STATUS" != "200" ]; then
            echo "Healthcheck failed! Container logs:"
            docker logs rwa-ci-container
            exit 1
          fi

          echo "Verifying non-root user execution..."
          USER_RUNNING=$(docker exec rwa-ci-container whoami)
          echo "Container is running as user: $USER_RUNNING"
          if [ "$USER_RUNNING" != "rwa" ]; then
            echo "Security warning: container is not running as 'rwa' non-root user!"
            exit 1
          fi

          echo "Cleaning up container..."
          docker stop rwa-ci-container
          docker rm rwa-ci-container

  ci-gate:
    name: CI Gate
    needs: [lint, frontend, backend, contracts, docker-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI Gate
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ CI Gate Failed: One or more prerequisite jobs failed or were cancelled."
            exit 1
          fi
          echo "✅ CI Gate Passed: All code quality, build, test, and container checks succeeded!"

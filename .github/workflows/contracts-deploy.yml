name: Deploy Smart Contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target Network"
        required: true
        default: "sepolia"
        type: choice
        options:
          - sepolia
          - localhost
      dry_run:
        description: "Dry-run only (compile & run test suite without deploying)"
        required: false
        default: false
        type: boolean
      token_symbol:
        description: "Token Symbol (e.g., RWAT)"
        required: false
        default: "RWAT"
      fmv_usd:
        description: "Fair Market Value USD (e.g., 3000000)"
        required: false
        default: "3000000"

permissions:
  contents: read

jobs:
  preflight:
    name: Pre-deployment Compilation & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci

      - name: Compile Hardhat contracts
        working-directory: contracts
        run: npm run compile

      - name: Run verification test suite
        working-directory: contracts
        run: npm run test

  deploy:
    name: Deploy to ${{ inputs.network }}
    needs: [preflight]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci

      - name: Deploy smart contracts
        working-directory: contracts
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          DEPLOY_TOKEN_SYMBOL: ${{ inputs.token_symbol }}
          DEPLOY_FMV_USD: ${{ inputs.fmv_usd }}
        run: |
          if [ "${{ inputs.network }}" = "sepolia" ]; then
            if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
              echo "Error: DEPLOYER_PRIVATE_KEY secret is required for Sepolia deployment."
              exit 1
            fi
            npm run deploy:sepolia
          else
            npm run deploy:localhost
          fi

      - name: Archive deployment artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-deployments-${{ inputs.network }}
          path: contracts/deployments
          retention-days: 30

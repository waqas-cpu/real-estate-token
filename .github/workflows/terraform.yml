name: "Infrastructure CI/CD (Terraform)"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform*.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform*.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate-and-scan:
    name: "Lint, Validate & Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Check Format
        run: |
          terraform fmt -check -recursive terraform/

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.50.3"

      - name: Run TFLint
        run: |
          tflint --init --config=terraform/.tflint.hcl || true
          tflint --recursive terraform/ || true

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          framework: terraform
          output_format: cli
          soft_fail: true
          directory: terraform/

  plan-dev:
    name: "Terraform Plan (Dev)"
    needs: validate-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Init Dev
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false

      - name: Terraform Validate Dev
        working-directory: terraform/environments/dev
        run: |
          terraform validate

  apply-dev:
    name: "Terraform Apply (Dev)"
    needs: plan-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      # In real cloud execution, OIDC or AWS credentials would be configured here:
      # - name: Configure AWS Credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::123456789012:role/github-actions-terraform-deployer
      #     aws-region: us-east-1

      - name: Terraform Init Dev
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false

      - name: Validate Dev Schema
        working-directory: terraform/environments/dev
        run: |
          terraform validate

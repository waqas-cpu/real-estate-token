# ============================================================
# Real Estate Token — Docker Compose (local / staging)
# Serves: Express API + React SPA + Nginx reverse proxy
#
# Usage:
#   1. Copy backend/.env.example → backend/.env and fill secrets
#   2. docker compose up --build
#   3. Open http://localhost:8080
# ============================================================

services:
  # ── Express API + React SPA ─────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rwa-api
    ports:
      - "3001:3001"
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVE_FRONTEND: "true"
      FRONTEND_DIST: /app/dist
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - rwa-net

  # ── Nginx reverse proxy ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: rwa-nginx
    ports:
      - "8080:80"
      # Uncomment for HTTPS:
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for HTTPS:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rwa-net

networks:
  rwa-net:
    driver: bridge

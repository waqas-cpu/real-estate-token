# Local / staging stack — set env vars in .env before: docker compose up
services:
  api:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

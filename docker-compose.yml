# ============================================================
# RWA Real Estate Tokenization Platform — Production Docker Compose
# Architecture: Reverse Proxy (Edge) + Frontend + Backend API +
# Workers + Indexer + Oracle + PostgreSQL (Internal) + Redis (Internal)
# ============================================================

services:
  # ── Edge Reverse Proxy (Public Entrypoint) ──────────────────
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: rwa-reverse-proxy
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rwa-public
      - rwa-app

  # ── React SPA (Static Web Application) ──────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rwa-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rwa-app

  # ── Core Backend REST API ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rwa-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-rwa_user}:${POSTGRES_PASSWORD:-rwa_secure_password}@postgres:5432/${POSTGRES_DB:-rwa_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-rwa_redis_secret}@redis:6379/0
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      RWA_NETWORK_PROFILE: ${RWA_NETWORK_PROFILE:-testnet}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      ALLOW_SMART_CONTRACT_DEPLOY: ${ALLOW_SMART_CONTRACT_DEPLOY:-false}
      ALLOW_TOKEN_ECONOMICS_APPLY: ${ALLOW_TOKEN_ECONOMICS_APPLY:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health/live"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - rwa-app
      - rwa-data

  # ── Background Worker (Monitoring, Sweeps, Audit Batching) ──
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: rwa-worker
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rwa_user}:${POSTGRES_PASSWORD:-rwa_secure_password}@postgres:5432/${POSTGRES_DB:-rwa_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-rwa_redis_secret}@redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rwa-data

  # ── Blockchain Event Indexer ────────────────────────────────
  indexer:
    build:
      context: .
      dockerfile: Dockerfile.indexer
    container_name: rwa-indexer
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-https://rpc.sepolia.org}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rwa_user}:${POSTGRES_PASSWORD:-rwa_secure_password}@postgres:5432/${POSTGRES_DB:-rwa_platform}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rwa-data

  # ── Oracle & Data Ingestion Service ─────────────────────────
  oracle:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    container_name: rwa-oracle
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rwa_user}:${POSTGRES_PASSWORD:-rwa_secure_password}@postgres:5432/${POSTGRES_DB:-rwa_platform}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rwa-data

  # ── PostgreSQL Database (Internal Network Only) ─────────────
  postgres:
    image: postgres:16-alpine
    container_name: rwa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rwa_platform}
      POSTGRES_USER: ${POSTGRES_USER:-rwa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rwa_secure_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/docker/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rwa_user} -d ${POSTGRES_DB:-rwa_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rwa-data

  # ── Redis Cache & Message Broker (Internal Network Only) ────
  redis:
    image: redis:7-alpine
    container_name: rwa-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-rwa_redis_secret}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rwa_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rwa-data

# ── Volumes ───────────────────────────────────────────────────
volumes:
  postgres-data:
    name: rwa-postgres-data
  redis-data:
    name: rwa-redis-data

# ── Network Segmentation (Trust Boundaries) ───────────────────
networks:
  # External public ingress
  rwa-public:
    name: rwa-network-public
    driver: bridge

  # Application tier communication
  rwa-app:
    name: rwa-network-app
    driver: bridge

  # Isolated data tier (No public ingress or internet routing)
  rwa-data:
    name: rwa-network-data
    driver: bridge
    internal: true
